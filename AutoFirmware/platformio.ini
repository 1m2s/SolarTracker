; PlatformIO project: autonomous sun-position calculation for the solar tracker
; Target: Arduino Nano (ATmega328P), board position "A_MATLAB" in Schaltplan_V1
; Tests are grouped in test/:  logic/ (math)  hardware/ (read-only)  setup/ (writes!)

[platformio]
default_envs = nanoatmega328   ; "pio run" only builds the Nano firmware

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328   ; left Nano (A_MATLAB), CH340 clone with the OLD bootloader
framework = arduino
monitor_speed = 115200
lib_deps = makuna/RTC@^2.5.0   ; DS1302 real-time clock (3-wire: CLK D5, DAT D6, RST D7)

; Math tests on the PC (also used by GitHub CI): pio test -e native
[env:native]
platform = native
test_build_src = yes                   ; also compile the files in src/
build_src_filter = +<*> -<main.cpp>    ; but not main.cpp (needs Arduino)
test_ignore = hardware/*, setup/*      ; need the real tracker, not for the PC

; Tests on the real Nano over USB (never writes to hardware):
;   pio test -e nanotest -f "logic/*"      math on the Nano
;   pio test -e nanotest -f "hardware/*"   read-only hardware checks
[env:nanotest]
extends = env:nanoatmega328            ; also inherits lib_deps (RTC library)
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_ignore = setup/*                  ; writing tools only via nanosetup

; One-time tools that WRITE to hardware (e.g. set the clock, winter time only!):
;   pio test -e nanosetup -f setup/test_rtc_set
[env:nanosetup]
extends = env:nanotest
test_ignore = logic/*, hardware/*      ; block everything except setup/
test_filter = setup/*                  ; and ONLY setup/, never anything else
