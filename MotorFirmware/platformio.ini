; PlatformIO project: motor firmware for the solar tracker
; Target: Arduino Nano (ATmega328P), board position "A_AIDE" in Schaltplan_V1
; Replaces Photovoltaiknachfuehrung.ino. Only the "ohne IMU" behaviour, no IMU.

[platformio]
default_envs = nanoatmega328   ; "pio run" only builds the Nano firmware

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328   ; right Nano (A_AIDE). Upload "not in sync"? -> try nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Stepper@^1.1.3
    arduino-libraries/Servo@^1.2.1
    symlink://../CurrentFirmware/Arduino/LedControl   ; same copy CurrentFirmware uses

; Logic tests on the PC (also used by GitHub CI): pio test -e native
[env:native]
platform = native
test_build_src = yes                                  ; also compile the files in src/
build_src_filter = +<*> -<main.cpp> -<Display.cpp>    ; not the parts that need Arduino