name: CI
 
on:
  push:
  pull_request:
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoFirmware
 
    steps:
      - name: Get the code
        uses: actions/checkout@v6
 
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
 
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
 
      - name: Install PlatformIO
        run: pip install --upgrade platformio
 
      - name: Build firmware for the Nano (no warnings in src/)
        run: pio run -e nanoatmega328
        env:
          PLATFORMIO_BUILD_SRC_FLAGS: "-Wall -Wextra -Wshadow -Werror"
 
      - name: Run unit tests on the PC
        run: pio test -e native

      - name: No warnings in our code
        run: bash tools/check_warnings.sh

      - name: Static analysis (cppcheck)
        run: |
          pip install cppcheck==1.5.3
          cppcheck --enable=warning,performance,portability --std=c++11 --language=c++ \
                   -Iinclude --suppress=missingIncludeSystem --inline-suppr \
                   --error-exitcode=1 --quiet src/

      - name: Build motor firmware for the right Nano
        working-directory: MotorFirmware
        run: pio run -e nanoatmega328

      - name: Run motor unit tests on the PC
        working-directory: MotorFirmware
        run: pio test -e native